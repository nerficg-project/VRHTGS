# Performance comparison for flowers (Tabs. 2/4/6 of the supplemental).
# Train the three models in benchmarks/configs/performance/*_flowers.yaml first.
rows:
  - name: HTGS
    run_dir: output/HTGS/perf_htgs_flowers_2*
  - name: AA+VSP
    run_dir: output/HTGS/perf_aa_flowers_2*
  - name: Ours (FR)
    run_dir: output/HTGS/perf_htgs_flowers_2*
    method: VRHTGS
  - name: Ours (NoBG)
    run_dir: output/HTGS/perf_aa_flowers_2*
    method: VRHTGS
  - name: Ours (Full)
    run_dir: output/HTGS/perf_full_flowers_2*
    method: VRHTGS

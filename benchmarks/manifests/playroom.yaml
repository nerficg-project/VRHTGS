# Performance comparison for playroom (Tabs. 2/4/6 of the supplemental).
# Train the three models in benchmarks/configs/performance/*_playroom.yaml first.
rows:
  - name: HTGS
    run_dir: output/HTGS/perf_htgs_playroom_2*
  - name: AA+VSP
    run_dir: output/HTGS/perf_aa_playroom_2*
  - name: Ours (FR)
    run_dir: output/HTGS/perf_htgs_playroom_2*
    method: VRHTGS
  - name: Ours (NoBG)
    run_dir: output/HTGS/perf_aa_playroom_2*
    method: VRHTGS
  - name: Ours (Full)
    run_dir: output/HTGS/perf_full_playroom_2*
    method: VRHTGS

# Performance comparison for barn (Tabs. 2/4/6 of the supplemental).
# Train the three models in benchmarks/configs/performance/*_barn.yaml first.
rows:
  - name: HTGS
    run_dir: output/HTGS/perf_htgs_barn_2*
  - name: AA+VSP
    run_dir: output/HTGS/perf_aa_barn_2*
  - name: Ours (FR)
    run_dir: output/HTGS/perf_htgs_barn_2*
    method: VRHTGS
  - name: Ours (NoBG)
    run_dir: output/HTGS/perf_aa_barn_2*
    method: VRHTGS
  - name: Ours (Full)
    run_dir: output/HTGS/perf_full_barn_2*
    method: VRHTGS

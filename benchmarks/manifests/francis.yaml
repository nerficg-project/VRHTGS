# Performance comparison for francis (Tabs. 2/4/6 of the supplemental).
# Train the three models in benchmarks/configs/performance/*_francis.yaml first.
rows:
  - name: HTGS
    run_dir: output/HTGS/perf_htgs_francis_2*
  - name: AA+VSP
    run_dir: output/HTGS/perf_aa_francis_2*
  - name: Ours (FR)
    run_dir: output/HTGS/perf_htgs_francis_2*
    method: VRHTGS
  - name: Ours (NoBG)
    run_dir: output/HTGS/perf_aa_francis_2*
    method: VRHTGS
  - name: Ours (Full)
    run_dir: output/HTGS/perf_full_francis_2*
    method: VRHTGS

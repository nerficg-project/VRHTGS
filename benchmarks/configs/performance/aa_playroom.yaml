GLOBAL:
  LOG_LEVEL: 2
  GPU_INDICES:
  - 0
  RANDOM_SEED: 0
  ANOMALY_DETECTION: false
  FILTER_WARNINGS: true
  METHOD_TYPE: HTGS
  DATASET_TYPE: Colmap
MODEL:
  SH_DEGREE: 3
  BACKGROUND_MODEL: NONE
  SH_BACKGROUND_MODEL:
    DEGREE: 3
    DISABLE_COARSE_TO_FINE: false
  ENVIRONMENT_MAP:
    TEXTURE_WIDTH: 2000
    TEXTURE_HEIGHT: 1000
RENDERER:
  BLEND_MODE: 0
  K: 16
  SCALE_MODIFIER: 1.0
  DISABLE_SH0: false
  DISABLE_SH1: false
  DISABLE_SH2: false
  DISABLE_SH3: false
  USE_AAA_MODE: true
  USE_MEDIAN_DEPTH: false
  FORCE_OPTIMIZED_INFERENCE: false
  DISABLE_BG_MODEL_INFERENCE: false
  BLUR_PERIPHERY: true
  FOVEATION_ENABLED: true
  FOVEATION_VISUALIZE_GAZE: false
  FOVEATION_VISUALIZE_TILE_GRID: false
  FOVEATION_VISUALIZATION_TYPE: 0
  FOVEATION_VISUALIZATION_SIZE: 32
  FOVEATION_VISUALIZATION_COLOR:
  - 0.8
  - 0.475
  - 0.655
  FOVEATION_VISIBILITY_MASK_INDEX: 0
TRAINING:
  LOAD_CHECKPOINT: null
  MODEL_NAME: perf_aa_playroom
  NUM_ITERATIONS: 30000
  RUN_VALIDATION: false
  DATA:
    PRELOADING_LEVEL: 1
    FIELDS:
    - rgb
    - alpha
    - segmentation
    PRECOMPUTE_RAYS: false
    RAYS_TO_DEVICE: false
  BACKUP:
    FINAL_CHECKPOINT: true
    RENDER_TESTSET: false
    RENDER_TRAINSET: false
    RENDER_VALSET: false
    INTERMEDIATE_RENDERINGS: true
    VISUALIZE_ERRORS: false
    INTERVAL: -1
    TRAINING_STATE: false
  TIMING:
    ACTIVATE: true
    INCLUDE_DATALOADING_IN_TOTAL: false
    INCLUDE_PRETRAINING_IN_TOTAL: false
    INCLUDE_POSTTRAINING_IN_TOTAL: false
  WANDB:
    ACTIVATE: false
    ENTITY: null
    PROJECT: htgs
    LOG_IMAGES: true
    INDEX_VALIDATION: -1
    INDEX_TRAINING: -1
    INTERVAL: 500
    SWEEP_MODE:
      ACTIVE: false
      START_ITERATION: 999
      ITERATION_STRIDE: 1000
      NUM_IMAGES: -1
  WRITE_VRAM_STATS: true
  GUI:
    ACTIVATE: false
    RENDER_INTERVAL: 5
    GUI_STATUS_ENABLED: true
    GUI_STATUS_INTERVAL: 20
    SKIP_GUI_SETUP: false
    FPS_ROLLING_AVERAGE_SIZE: 100
    MAX_RENDERS_BETWEEN_GUI_UPDATES: 2
  LEARNING_RATE_POSITION_INIT: 0.00016
  LEARNING_RATE_POSITION_FINAL: 1.6e-06
  LEARNING_RATE_POSITION_MAX_STEPS: 30000
  LEARNING_RATE_FEATURE: 0.0025
  LEARNING_RATE_OPACITY: 0.05
  LEARNING_RATE_SCALING: 0.005
  LEARNING_RATE_ROTATION: 0.001
  LEARNING_RATE_BACKGROUND_INIT: 0.1
  LEARNING_RATE_BACKGROUND_FINAL: 0.001
  LEARNING_RATE_BACKGROUND_MAX_STEPS: 10000
  PERCENT_DENSE: 0.01
  USE_3D_FILTER: true
  USE_OPACITY_RESET: false
  OPACITY_RESET_MAX_OPACITY: 0.01
  USE_OPACITY_DECAY: true
  USE_VISIBILITY_PRUNING: true
  VISIBILITY_PRUNING_THRESHOLD: 0.01
  USE_DISTANCE_SCALING: true
  OPACITY_RESET_INTERVAL: 3000
  OPACITY_THRESHOLD: 0.005
  DENSIFY_START_ITERATION: 500
  DENSIFY_END_ITERATION: 15000
  DENSIFICATION_INTERVAL: 100
  DENSIFY_GRAD_THRESHOLD: 0.0002
  SKY_MASK_SCALE_FACTOR: 1.0
  LOSS:
    LAMBDA_L1: 0.8
    LAMBDA_DSSIM: 0.2
    LAMBDA_BCE: 0.0
    LAMBDA_BG_SEPARATION: 0.0
DATASET:
  PATH: dataset/deep_blending/Playroom
  IMAGE_SCALE_FACTOR: null
  BACKGROUND_COLOR:
  - 0.0
  - 0.0
  - 0.0
  NEAR_PLANE: 0.01
  FAR_PLANE: 1000.0
  TEST_STEP: 8
  APPLY_PCA: true
